name: CI

on:
  push:
    branches: [main]
    tags-ignore:
      - '**'  # Skip CI for tag pushes (Release workflow will handle it)
  pull_request:
    branches: [main]

jobs:
  test-node-18:
    name: Quality Checks
    uses: ./.github/workflows/quality-checks.yml
    with:
      node-version: '18.x'

  test-node-20:
    name: Quality Checks
    uses: ./.github/workflows/quality-checks.yml
    with:
      node-version: '20.x'

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run coverage
        run: yarn test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false
