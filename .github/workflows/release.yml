name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  # Check if CI already passed for this commit
  check-ci-status:
    name: Check CI Status
    runs-on: ubuntu-latest
    outputs:
      should-run-checks: ${{ steps.check.outputs.should_run }}
      ci-status: ${{ steps.check.outputs.ci_status }}
    steps:
      - name: Check if CI already passed
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking CI status for commit ${{ github.sha }}"

          # Check all workflow runs for this commit
          RUNS=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs \
            --jq '.check_runs[] | select(.name | startswith("Quality Checks")) | .conclusion')

          echo "CI check runs: $RUNS"

          # If any quality check passed, we don't need to run again
          if echo "$RUNS" | grep -q "success"; then
            echo "✅ CI already passed for this commit"
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "ci_status=passed" >> $GITHUB_OUTPUT
          else
            echo "⚠️  No successful CI run found, will run quality checks"
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "ci_status=not_found" >> $GITHUB_OUTPUT
          fi

  # Run quality checks only if CI hasn't passed yet
  quality-checks:
    name: Quality Checks (Conditional)
    needs: check-ci-status
    if: needs.check-ci-status.outputs.should-run-checks == 'true'
    uses: ./.github/workflows/quality-checks.yml
    with:
      node-version: '20.x'

  # Release job depends on quality checks (either passed or skipped)
  release:
    name: Create Release & Publish
    needs: [check-ci-status, quality-checks]
    if: |
      always() &&
      (needs.quality-checks.result == 'success' || needs.quality-checks.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          # Check if this is a prerelease
          if [[ "$VERSION" =~ (alpha|beta|rc) ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Log CI status
        run: |
          echo "CI Status: ${{ needs.check-ci-status.outputs.ci-status }}"
          if [ "${{ needs.check-ci-status.outputs.ci-status }}" = "passed" ]; then
            echo "✅ Reusing CI validation from previous run"
          else
            echo "✅ Quality checks completed in this workflow"
          fi

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build package
        run: yarn build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true

      - name: Publish to npm
        run: npm publish --access public --provenance
