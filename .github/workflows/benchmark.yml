name: Performance Benchmarks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger

jobs:
  benchmark:
    name: Run Performance Benchmarks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for comparison

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run performance benchmarks (JSON output)
        run: npx vitest bench --run --config config/vitest.config.ts --outputJson bench-output.json

      - name: Convert to BenchmarkJS format
        run: node scripts/vitest-to-benchmarkjs.js bench-output.json benchmark-results.json

      - name: Debug - Verify benchmark files exist
        run: |
          echo "Checking if benchmark files exist..."
          ls -lh bench-output.json benchmark-results.json
          echo ""
          echo "First 20 lines of benchmark-results.json:"
          head -n 20 benchmark-results.json

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'benchmarkjs'
          output-file-path: benchmark-results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: false
          comment-on-alert: true
          fail-on-alert: false
          alert-threshold: '200%'

      - name: Upload benchmark results as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: |
            bench-output.json
            benchmark-results.json
          retention-days: 30
          if-no-files-found: warn

      - name: Comment PR with benchmark results
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');

            // Read benchmark results
            let benchmarkComment = '## 📊 Performance Benchmark Results\n\n';

            try {
              const results = JSON.parse(fs.readFileSync('benchmark-results.json', 'utf-8'));

              if (results.length === 0) {
                benchmarkComment += '⚠️ No benchmark results found.\n';
              } else {
                benchmarkComment += '✅ All performance benchmarks completed!\n\n';
                benchmarkComment += '| Benchmark | ops/sec | Variance |\n';
                benchmarkComment += '|-----------|---------|----------|\n';

                for (const bench of results) {
                  const name = bench.name.length > 50 ? bench.name.substring(0, 47) + '...' : bench.name;
                  const value = bench.value.toLocaleString('en-US', { maximumFractionDigits: 2 });
                  benchmarkComment += `| ${name} | ${value} | ${bench.range} |\n`;
                }

                benchmarkComment += '\n_Note: Run `npm run bench` locally for detailed results._';
              }
            } catch (error) {
              benchmarkComment += '⚠️ Could not read benchmark results.\n';
              benchmarkComment += `Error: ${error.message}\n\n`;
              benchmarkComment += '_Note: Run `npm run bench` locally for detailed results._';
            }

            // Post comment on PR
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: benchmarkComment
            });

  regression-check:
    name: Check for Performance Regressions
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run benchmarks on PR branch
        run: npx vitest bench --run --config config/vitest.config.ts --outputJson pr-bench-output.json

      - name: Convert PR benchmarks to BenchmarkJS format
        run: node scripts/vitest-to-benchmarkjs.js pr-bench-output.json pr-benchmark-results.json

      - name: Checkout base branch
        run: |
          git fetch origin ${{ github.base_ref }}
          git checkout origin/${{ github.base_ref }}

      - name: Install dependencies (base)
        run: npm ci

      - name: Build project (base)
        run: npm run build

      - name: Run benchmarks on base branch
        run: npx vitest bench --run --config config/vitest.config.ts --outputJson base-bench-output.json

      - name: Convert base benchmarks to BenchmarkJS format
        run: node scripts/vitest-to-benchmarkjs.js base-bench-output.json base-benchmark-results.json

      - name: Compare results
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            try {
              const prResults = JSON.parse(fs.readFileSync('pr-benchmark-results.json', 'utf-8'));
              const baseResults = JSON.parse(fs.readFileSync('base-benchmark-results.json', 'utf-8'));

              let comment = '## 📊 Benchmark Comparison\n\n';
              comment += '| Benchmark | Base ops/sec | PR ops/sec | Change |\n';
              comment += '|-----------|--------------|------------|--------|\n';

              const baseMap = new Map(baseResults.map(b => [b.name, b]));

              for (const prBench of prResults) {
                const baseBench = baseMap.get(prBench.name);
                if (baseBench) {
                  const baseValue = baseBench.value.toLocaleString('en-US', { maximumFractionDigits: 0 });
                  const prValue = prBench.value.toLocaleString('en-US', { maximumFractionDigits: 0 });
                  const change = ((prBench.value - baseBench.value) / baseBench.value * 100).toFixed(2);
                  const changeIcon = change > 0 ? '🚀' : change < 0 ? '⚠️' : '➡️';
                  const name = prBench.name.length > 40 ? prBench.name.substring(0, 37) + '...' : prBench.name;

                  comment += `| ${name} | ${baseValue} | ${prValue} | ${changeIcon} ${change}% |\n`;
                } else {
                  comment += `| ${prBench.name} | N/A | ${prBench.value.toLocaleString('en-US', { maximumFractionDigits: 0 })} | 🆕 New |\n`;
                }
              }

              console.log(comment);
            } catch (error) {
              console.log('## ⚠️ Benchmark Comparison Failed\n');
              console.log(`Error: ${error.message}`);
            }
